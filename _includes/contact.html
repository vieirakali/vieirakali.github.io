<ul class="contact">
  <li><a href="mailto:{{ site.email }}">{{ site.email }}</a></li>
  {%- if site.phone -%}<li>{{ site.phone }}</li>{%- endif -%}
  {%- if site.linkedin_url -%}<li><a href="{{ site.linkedin_url }}" target="_blank" rel="noopener">LinkedIn</a></li>{%- endif -%}
  {%- if site.github_username -%}<li><a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener">Github</a></li>{%- endif -%}
</ul>
